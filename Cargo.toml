[package]
name = "screen-translate"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
rten = "0.27"
rten-tensor = "0.27"
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
png = "0.18"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# The test reads real images; unoptimised tensor code would take minutes.
[profile.test]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
