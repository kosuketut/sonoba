[package]
name = "sonoba"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
rten = "0.27"
rten-tensor = "0.27"
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false, features = ["std", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Com", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-web-kit = "0.3"

[dev-dependencies]
png = "0.18"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# The test reads real images; unoptimised tensor code would take minutes.
[profile.test]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
